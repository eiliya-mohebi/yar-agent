[project]
name = "yar-agent"
version = "0.1.0"
description = "A minimal, transparent, local-first Yar: harness + loop + memory + eval, in code you can read in an afternoon."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.scripts]
yar = "yar.__main__:main"

[project.optional-dependencies]
eval = [
    "pytest>=8.0",
    "deepeval>=2.0",
]
tracing = [
    "arize-phoenix>=7.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8.0",
    # Pin exactly so a ruff release cannot turn lint red overnight.
    # Prefer the newest version that clears uv's 7-day exclude-newer window.
    "ruff==0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yar"]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["evals"]
pythonpath = ["."]
